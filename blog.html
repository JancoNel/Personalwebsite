<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stylesheets/main.css">
    <link rel="stylesheet" href="stylesheets/tags.css">
    <style>
        body {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            font-family: sans-serif;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 1rem;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        ul#blog-list {
            list-style: none;
            padding: 0;
        }

        ul#blog-list li {
            padding: 12px 0;
            border-bottom: 1px solid #ccc;
        }

        ul#blog-list li a {
            text-decoration: none;
            color: #ff79c6;
            font-size: 1.1rem;
        }

        ul#blog-list li a:hover {
            color: #007bff;
        }

    </style>
</head>
<body>
    <a class="back-button" href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <h1><i class="fas fa-book"></i> My Blog</h1>
    <ul id="blog-list">Loading...</ul>

    <script src="scripts/blog.js"></script>
</body>
</html>
